server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: ทุก path ที่ไม่ตรงกับไฟล์จริง ให้ส่งกลับ index.html
    # จำเป็นสำหรับ React Router ไม่งั้น refresh หน้าเช่น /assets/xxx จะเจอ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache ไฟล์ static (js/css/รูปภาพ) ที่มี hash ในชื่อไฟล์ได้นานๆ
    # ใช้ regex จับตามนามสกุลไฟล์ ไม่ใช้ path prefix เพราะ /assets/ ชนกับ
    # React Route "/assets/:id" ของแอป (หน้ารายละเอียดอุปกรณ์) พอดี
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
